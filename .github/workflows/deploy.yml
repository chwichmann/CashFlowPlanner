name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Publish Blazor
        run: dotnet publish src/CashFlowPlanner.BlazorWasm/CashFlowPlanner.BlazorWasm.csproj -c Release

      - name: Set GitHub Pages base href
        run: |
          INDEX_FILE="publish/wwwroot/index.html"
      
          if [ ! -f "$INDEX_FILE" ]; then
            echo "index.html not found at $INDEX_FILE"
            echo "Available index.html files:"
            find . -name index.html
            exit 1
          fi
      
          sed -i 's|<base href="[^"]*"|<base href="/CashFlowPlanner/"|' "$INDEX_FILE"
      
          echo "Base href after rewrite:"
          grep '<base' "$INDEX_FILE"
      
      - name: Create GitHub Pages SPA fallback
        run: |
          cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Add .nojekyll
        run: touch src/CashFlowPlanner.BlazorWasm/bin/Release/net10.0/publish/wwwroot/.nojekyll

      - name: Show publish output
        run: |
          echo "Publish wwwroot:"
          ls -la src/CashFlowPlanner.BlazorWasm/bin/Release/net10.0/publish/wwwroot
          echo "Framework folder:"
          ls -la src/CashFlowPlanner.BlazorWasm/bin/Release/net10.0/publish/wwwroot/_framework
          echo "Blazor bootstrap files:"
          ls -la src/CashFlowPlanner.BlazorWasm/bin/Release/net10.0/publish/wwwroot/_framework/blazor.webassembly*

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/CashFlowPlanner.BlazorWasm/bin/Release/net10.0/publish/wwwroot
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
