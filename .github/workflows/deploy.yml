name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Publish Blazor
        run: dotnet publish src/CashFlowPlanner.BlazorWasm/CashFlowPlanner.BlazorWasm.csproj -c Release

      - name: Show publish output
        run: |
          echo "Publish wwwroot:"
          ls -la src/CashFlowPlanner.BlazorWasm/bin/Release/net10.0/publish/wwwroot
          echo "Framework folder:"
          ls -la src/CashFlowPlanner.BlazorWasm/bin/Release/net10.0/publish/wwwroot/_framework

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/CashFlowPlanner.BlazorWasm/bin/Release/net10.0/publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
