name: CI and Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  # Pull requests build and test but never deploy, so a change to this workflow
  # can be validated without pushing to master.
  pull_request:
    branches: [ master ]
  # Re-deploy the current master without an empty commit.
  workflow_dispatch:

# B4 - least privilege. The workflow default is read-only; `pages: write` and
# `id-token: write` are granted to the deploy job ONLY. The build job runs
# `dotnet restore`, which executes arbitrary MSBuild from NuGet packages, and
# must never hold a token that can publish a deployment or mint an OIDC token.
permissions:
  contents: read

# B3 - one deployment at a time. Without this, back-to-back pushes race the
# github-pages environment and the older build can land last, publishing stale
# content. cancel-in-progress is false so an in-flight deployment is allowed to
# finish rather than leaving the site half-updated.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  # The URL the site is served from. The base href assertion below is derived
  # from this, so there is exactly one place to change it.
  PAGES_BASE_HREF: "/CashFlowPlanner/"

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Pinned via global.json (rollForward: latestFeature) instead of the
      # floating 10.0.x, which drifted across SDK feature bands between local
      # dev and CI.
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # B6 - without the wasm-tools workload the SDK prints
      # "Publishing without optimizations. Although it's optional for Blazor, we
      # strongly recommend using `wasm-tools` workload!" and ships
      # dotnet.native.wasm unrelinked.
      # --skip-manifest-update keeps the workload pinned to the manifest that
      # ships with the SDK band, so the publish output is reproducible instead
      # of drifting whenever a new manifest is released.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Restore
        run: dotnet restore CashFlowPlanner.slnx

      # B5 - TreatWarningsAsErrors is set in Directory.Build.props, so this
      # step fails on any new warning.
      - name: Build
        run: dotnet build CashFlowPlanner.slnx -c Release --no-restore

      # B1 - the test gate. 223 tests existed and nothing in CI ran them, so a
      # red test suite could deploy. coverlet.collector 6.0.4 was referenced by
      # both test projects and had never once been invoked.
      - name: Test
        run: |
          dotnet test CashFlowPlanner.slnx \
            -c Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=normal" \
            --collect:"XPlat Code Coverage" \
            --results-directory "${{ runner.temp }}/test-results"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          retention-days: 14
          if-no-files-found: warn

      # The publish location is defined once, here, instead of the
      # bin/Release/net10.0/publish/wwwroot path being repeated seven times
      # (which also hardcoded the target framework into the workflow).
      - name: Resolve publish directory
        run: |
          echo "PUBLISH_DIR=${RUNNER_TEMP}/publish" >> "$GITHUB_ENV"
          echo "PUBLISH_WWWROOT=${RUNNER_TEMP}/publish/wwwroot" >> "$GITHUB_ENV"

      - name: Publish Blazor WebAssembly
        run: |
          dotnet publish src/CashFlowPlanner.BlazorWasm/CashFlowPlanner.BlazorWasm.csproj \
            -c Release \
            --no-restore \
            -o "$PUBLISH_DIR"

      # B6 - GitHub Pages negotiates compression itself and never serves these
      # sidecars, so they are 9.6 MB of dead weight in the artifact. They are
      # also written BEFORE the base href rewrite below, which means every
      # index.html.gz / index.html.br still contains <base href="/"> - a latent
      # trap if anything ever did serve them. Delete them before the rewrite so
      # no stale copy can survive it. Verified: nothing in index.html,
      # dotnet.js or blazor.webassembly.js references a .gz or .br URL.
      - name: Strip precompressed sidecars from artifact
        run: |
          set -euo pipefail
          before=$(find "$PUBLISH_WWWROOT" -type f \( -name '*.gz' -o -name '*.br' \) | wc -l | tr -d ' ')
          find "$PUBLISH_WWWROOT" -type f \( -name '*.gz' -o -name '*.br' \) -delete
          echo "Removed $before precompressed sidecar files."

      # ------------------------------------------------------------------
      # B2 - THE highest-risk line in the repo.
      #
      # `sed` exits 0 whether or not it matched anything. The previous version
      # of this step rewrote <base href="/"> to /CashFlowPlanner/ and then only
      # *printed* the result. If a future SDK emitted the tag differently -
      # single quotes, no space, self-closing variations, an importmap-injected
      # base - the rewrite would silently no-op, CI would go green, and every
      # asset on the deployed site would 404: a blank page with an eternal
      # spinner and no failing build anywhere.
      #
      # The rewrite is now asserted three ways: exactly one <base> tag must
      # exist going in, the expected href must be present coming out, and no
      # root-relative base may survive.
      # ------------------------------------------------------------------
      - name: Set and assert GitHub Pages base href
        run: |
          set -euo pipefail

          INDEX_FILE="$PUBLISH_WWWROOT/index.html"

          if [ ! -f "$INDEX_FILE" ]; then
            echo "::error::index.html not found at $INDEX_FILE"
            echo "Publish output tree:"
            find "$PUBLISH_DIR" -maxdepth 3 -name 'index.html' -print
            exit 1
          fi

          # Pre-condition: the file must contain exactly one <base> tag. Zero
          # means the SDK stopped emitting it; more than one means the rewrite
          # would be ambiguous.
          base_count=$(grep -c -i '<base[[:space:]]' "$INDEX_FILE" || true)
          if [ "$base_count" -ne 1 ]; then
            echo "::error::expected exactly one <base> tag in index.html, found ${base_count}."
            echo "::error::The base href rewrite cannot be applied safely. Inspect index.html:"
            grep -n -i '<base' "$INDEX_FILE" || echo "  (no <base> tag at all)"
            exit 1
          fi

          echo "Base href before rewrite: $(grep -o -i '<base[^>]*>' "$INDEX_FILE")"

          sed -i "s|<base href=\"[^\"]*\"|<base href=\"${PAGES_BASE_HREF}\"|" "$INDEX_FILE"

          # Post-condition 1: the expected base href is actually present.
          # This is the assertion whose absence made a silent blank deploy
          # possible. Do not remove it.
          if ! grep -q "<base href=\"${PAGES_BASE_HREF}\"" "$INDEX_FILE"; then
            echo "::error::base href rewrite FAILED - '<base href=\"${PAGES_BASE_HREF}\"' is not present in index.html after sed."
            echo "::error::The published site would load every asset from the wrong origin and render a blank page."
            echo "Actual <base> tag:"
            grep -n -i '<base' "$INDEX_FILE" || echo "  (none)"
            exit 1
          fi

          # Post-condition 2: no root-relative base survived the rewrite.
          if grep -q '<base href="/"' "$INDEX_FILE"; then
            echo "::error::a root-relative '<base href=\"/\">' is still present after the rewrite."
            grep -n -i '<base' "$INDEX_FILE"
            exit 1
          fi

          echo "Base href after rewrite:  $(grep -o -i '<base[^>]*>' "$INDEX_FILE")"

      # The SPA fallback is a copy of the rewritten index.html, so it inherits
      # the asserted base href rather than needing its own rewrite.
      - name: Create GitHub Pages SPA fallback
        run: |
          set -euo pipefail
          cp "$PUBLISH_WWWROOT/index.html" "$PUBLISH_WWWROOT/404.html"
          grep -q "<base href=\"${PAGES_BASE_HREF}\"" "$PUBLISH_WWWROOT/404.html"
          echo "404.html SPA fallback written and verified."

      # The service worker caches every asset with a Subresource Integrity hash
      # taken from service-worker-assets.js, which the SDK generates during
      # publish - i.e. BEFORE the base href rewrite above. Rewriting index.html
      # changes its bytes and therefore its hash, so cache.addAll() rejects with
      # an integrity failure, the worker never installs, and the app silently
      # loses offline support and installability.
      #
      # This only ever fails in production: locally there is no rewrite, so the
      # hashes match and everything looks fine.
      #
      # Recompute the hash for every file this workflow touched after publish.
      - name: Repair service worker asset hashes
        run: |
          set -euo pipefail

          ASSETS_FILE="$PUBLISH_WWWROOT/service-worker-assets.js"

          if [ ! -f "$ASSETS_FILE" ]; then
            echo "::error::service-worker-assets.js not found - the PWA would ship without offline support."
            exit 1
          fi

          python3 - "$PUBLISH_WWWROOT" "$ASSETS_FILE" <<'PY'
          import base64, hashlib, pathlib, re, sys

          wwwroot = pathlib.Path(sys.argv[1])
          assets_file = pathlib.Path(sys.argv[2])
          text = assets_file.read_text(encoding="utf-8")

          # Files this workflow rewrites or creates after the SDK hashed them.
          repaired, missing = [], []
          for name in ("index.html", "404.html"):
              path = wwwroot / name
              if not path.exists():
                  continue

              digest = hashlib.sha256(path.read_bytes()).digest()
              new_hash = "sha256-" + base64.b64encode(digest).decode("ascii")

              # Match the hash belonging to this asset's entry, whichever order
              # the "hash"/"url" keys appear in.
              pattern = re.compile(
                  r'("hash"\s*:\s*")([^"]+)("\s*,\s*"url"\s*:\s*"' + re.escape(name) + r'")')
              text, n = pattern.subn(lambda m: m.group(1) + new_hash + m.group(3), text)

              if n:
                  repaired.append(f"{name} -> {new_hash} ({n} entr{'y' if n == 1 else 'ies'})")
              else:
                  missing.append(name)

          if missing:
              print(f"::error::no service-worker-assets.js entry found for: {', '.join(missing)}")
              print("The worker would fail its integrity check on those files and never install.")
              sys.exit(1)

          if not repaired:
              print("::error::nothing was repaired - the asset manifest format has changed.")
              sys.exit(1)

          assets_file.write_text(text, encoding="utf-8")
          for line in repaired:
              print("Repaired hash:", line)
          PY

          # Assert the repair actually landed: the served index.html hash must
          # now be present in the manifest.
          expected="sha256-$(openssl dgst -sha256 -binary "$PUBLISH_WWWROOT/index.html" | openssl base64 -A)"
          if ! grep -q "$expected" "$ASSETS_FILE"; then
            echo "::error::index.html hash ${expected} is still absent from service-worker-assets.js."
            exit 1
          fi
          echo "Service worker asset hashes verified against the rewritten files."

      # Loads the PUBLISHED app in a real browser and checks it runs. Everything above
      # this point proves the artifact was produced; nothing proved it works.
      #
      # Two production failures got past a green build and the full unit suite: dropping
      # the globalization data shipped a site that reached 100% and then died before
      # rendering, and the bundled example shipped a person with a blank name. Both are
      # caught here in seconds. CFP_SMOKE_REQUIRED makes a missing browser or publish
      # output a hard failure rather than a quiet pass.
      - name: Install browser for smoke tests
        run: pwsh tests/CashFlowPlanner.SmokeTests/bin/Release/net10.0/playwright.ps1 install chromium --with-deps

      - name: Smoke test the published app
        # A hang here must fail fast rather than eat the job's 30 minutes. The suite
        # takes well under a minute; anything near this ceiling is a defect.
        timeout-minutes: 8
        env:
          CFP_PUBLISH_WWWROOT: ${{ env.PUBLISH_WWWROOT }}
          CFP_SMOKE_REQUIRED: "1"
        run: >-
          dotnet test tests/CashFlowPlanner.SmokeTests
          -c Release
          --no-build
          --logger "trx;LogFileName=smoke.trx"

      - name: Ensure .nojekyll
        run: |
          set -euo pipefail
          touch "$PUBLISH_WWWROOT/.nojekyll"
          test -f "$PUBLISH_WWWROOT/.nojekyll"

      - name: Artifact size report
        run: |
          set -euo pipefail
          {
            echo "### Published artifact"
            echo
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Total size | $(du -sh "$PUBLISH_WWWROOT" | cut -f1) |"
            echo "| File count | $(find "$PUBLISH_WWWROOT" -type f | wc -l | tr -d ' ') |"
            echo "| \`_framework\` | $(du -sh "$PUBLISH_WWWROOT/_framework" | cut -f1) |"
            echo "| Base href | \`$(grep -o -i '<base[^>]*>' "$PUBLISH_WWWROOT/index.html")\` |"
            echo
            echo "Ten largest files:"
            echo
            echo '```'
            find "$PUBLISH_WWWROOT" -type f -exec du -k {} + | sort -rn | head -10
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # `include-hidden-files` was removed: it is an input of
      # actions/upload-artifact, not of upload-pages-artifact, so it produced an
      # "Unexpected input" warning and did nothing. The action tars the
      # directory contents, which already includes dotfiles such as .nojekyll.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ env.PUBLISH_WWWROOT }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Pull requests build and test above, then stop here.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # B4 - the only job that holds deployment credentials. It runs no project
    # code: it only claims the artifact the build job produced.
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
