<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CashFlow Planner</title>
    <meta name="description"
          content="Private Swiss household cashflow planner. Runs entirely in your browser; your data never leaves your machine." />
    <meta name="theme-color" content="#0f213d" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <!-- Design tokens. Must stay between Bootstrap (whose :root defaults they
         override) and app.css (which reads them). See css/tokens.css. -->
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link href="CashFlowPlanner.BlazorWasm.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        window.cashFlowPlanner = {
            downloadTextFile: function (fileName, content, contentType) {
                const blob = new Blob([content], { type: contentType || "application/json" });
                const url = URL.createObjectURL(blob);

                const anchor = document.createElement("a");
                anchor.href = url;
                anchor.download = fileName;
                anchor.click();

                URL.revokeObjectURL(url);
            },

            // Diagnostics for the last failed localStorage write, read back by .NET so that a full
            // quota can be reported to the user instead of being swallowed (finding P1b).
            lastStorageError: null,

            setLocalStorageItem: function (key, value) {
                try {
                    localStorage.setItem(key, value);
                    window.cashFlowPlanner.lastStorageError = null;
                    return true;
                } catch (error) {
                    const isQuotaExceeded =
                        error &&
                        (error.name === "QuotaExceededError" ||
                            error.name === "NS_ERROR_DOM_QUOTA_REACHED" ||
                            error.code === 22 ||
                            error.code === 1014);

                    window.cashFlowPlanner.lastStorageError = {
                        name: (error && error.name) || "Error",
                        message: (error && error.message) || String(error),
                        isQuotaExceeded: !!isQuotaExceeded
                    };

                    return false;
                }
            },

            getLastStorageError: function () {
                return window.cashFlowPlanner.lastStorageError;
            },

            // Set from .NET whenever CashFlowAppState.IsDirty flips (finding P1c).
            hasUnsavedChanges: false,

            setUnsavedChanges: function (hasUnsavedChanges) {
                window.cashFlowPlanner.hasUnsavedChanges = !!hasUnsavedChanges;
            },

            getLocalStorageItem: function (key) {
                try {
                    return localStorage.getItem(key);
                } catch (error) {
                    return null;
                }
            },

            removeLocalStorageItem: function (key) {
                try {
                    localStorage.removeItem(key);
                } catch (error) {
                    // Storage is unavailable; there is nothing to remove and nothing to report.
                }
            }
        };

        // The plan file is the source of truth; localStorage is only a working copy that a
        // cleared site-data wipes. Warn before the tab closes on unexported edits (finding P1c).
        window.addEventListener("beforeunload", function (event) {
            if (!window.cashFlowPlanner.hasUnsavedChanges) {
                return undefined;
            }

            event.preventDefault();
            event.returnValue = "";

            return "";
        });

        // Register the service worker that makes the app installable and offline-capable.
        // Resolved against document.baseURI so it works both locally (/) and on GitHub
        // Pages (/CashFlowPlanner/), where CI rewrites the base href in this file.
        //
        // Keep the words "base" and "href" apart in this file outside the real tag: the
        // deploy workflow asserts there is exactly one base element, and it counts text
        // matches, so writing the tag name in a comment fails the build.
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker
                    .register(new URL("service-worker.js", document.baseURI))
                    .then(function (registration) {
                        window.cashFlowPlanner.__swRegistration = registration;

                        // A worker sitting in "waiting" means a newer deploy is downloaded
                        // and ready but deliberately not activated yet. Without surfacing
                        // this, the user silently runs one release behind until they happen
                        // to close every tab.
                        var notify = function () {
                            // navigator.serviceWorker.controller is null on a FIRST install.
                            // Without this guard every first-time visitor is told an update
                            // is ready: a brand-new worker passes transiently through the
                            // "installed" state, where registration.waiting is briefly set,
                            // before it auto-activates because nothing is controlling the
                            // page yet. Only a page already under a worker can be stale.
                            if (!navigator.serviceWorker.controller) { return; }

                            if (registration.waiting) {
                                window.cashFlowPlanner.__updateReady = true;
                                if (window.cashFlowPlanner.__onUpdateReady) {
                                    window.cashFlowPlanner.__onUpdateReady.invokeMethodAsync("OnUpdateReady");
                                }
                            }
                        };

                        notify();
                        registration.addEventListener("updatefound", function () {
                            var installing = registration.installing;
                            if (!installing) { return; }
                            installing.addEventListener("statechange", notify);
                        });
                    })
                    .catch(function (error) {
                        // Offline support is an enhancement: the app works without it, so a
                        // failed registration must never block startup.
                        console.warn("Service worker registration failed:", error);
                    });

                // Reload once the new worker actually takes control, so the page and the
                // framework files it loaded always come from the same build.
                var reloading = false;
                navigator.serviceWorker.addEventListener("controllerchange", function () {
                    if (reloading) { return; }
                    reloading = true;
                    window.location.reload();
                });
            });
        }

        window.cashFlowPlanner.registerUpdateHandler = function (dotNetRef) {
            window.cashFlowPlanner.__onUpdateReady = dotNetRef;
            return !!window.cashFlowPlanner.__updateReady;
        };

        window.cashFlowPlanner.applyUpdate = function () {
            var registration = window.cashFlowPlanner.__swRegistration;
            if (registration && registration.waiting) {
                registration.waiting.postMessage("cashflowplanner:skipWaiting");
            } else {
                window.location.reload();
            }
        };
    </script>
</body>

</html>
