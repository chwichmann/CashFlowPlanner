<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlazorWasm</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="CashFlowPlanner.BlazorWasm.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        window.cashFlowPlanner = {
            downloadTextFile: function (fileName, content, contentType) {
                const blob = new Blob([content], { type: contentType || "application/json" });
                const url = URL.createObjectURL(blob);

                const anchor = document.createElement("a");
                anchor.href = url;
                anchor.download = fileName;
                anchor.click();

                URL.revokeObjectURL(url);
            },

            setLocalStorageItem: function (key, value) {
                localStorage.setItem(key, value);
            },

            getLocalStorageItem: function (key) {
                return localStorage.getItem(key);
            },

            removeLocalStorageItem: function (key) {
                localStorage.removeItem(key);
            }
        };
    </script>
</body>

</html>
